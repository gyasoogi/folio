(()=>{

let db=null, saveTimer=null, currentView='home', activeDocId=null, currentBoardId=null, currentTag=null, searchQuery='', searchFilter='all', pendingAttachDoc=null, editorDirty=false, saveStatus='saved';
let boardTransform={x:0,y:0,scale:1}, boardDrag=null, selectedCard=null, selectedCardIds=[], connectMode=false, connectFrom=null, lastPointer=null, suppressBoardCardClick=false, boardDropPosition=null, boardUndoStack=[], boardRedoStack=[], boardSketchMode=false, boardSketchTool='pen', boardSketchWidth=4, boardSketchColor='#222222', spacePressed=false;
const seed=()=>{const t=now();const docs=[
{id:'seed-idea',kind:'document',title:'작은 생각을 오래 남기는 방법',body:'좋은 아이디어는 처음부터 완성된 형태로 도착하지 않는다.\n\n떠오른 순간에는 불완전해도 괜찮다. 먼저 기록하고, 나중에 다시 읽고, 다른 생각과 연결하면서 의미를 발견한다.\n\nFolio는 그 과정을 가볍게 이어갈 수 있는 개인적인 공간이다.',tags:['생각','기록'],category:'에세이',attachments:[],createdAt:t,updatedAt:t},
{id:'seed-research',kind:'document',title:'레퍼런스 수집 방식',body:'## 수집 원칙\n\n- 원본 출처를 함께 남긴다.\n- 무엇이 인상적이었는지 한 문장으로 기록한다.\n- 프로젝트와 연결될 가능성을 열어 둔다.\n\n자료를 많이 모으는 것보다 다시 찾아 쓸 수 있는 상태로 만드는 것이 중요하다.',tags:['리서치','워크플로'],category:'작업 노트',attachments:[],createdAt:t,updatedAt:t},
{id:'seed-note',kind:'note',title:'',body:'보드에서는 정리하기보다 연결하기에 집중해 보기',tags:['아이디어'],category:'',attachments:[],createdAt:t,updatedAt:t},
{id:'seed-link',kind:'note',title:'읽어볼 것',body:'https://example.com\n나중에 이 자료의 핵심을 요약하고 관련 문서에 연결하기.',tags:['나중에'],category:'',attachments:[{id:'seed-url',type:'url',name:'example.com',url:'https://example.com'}],createdAt:t,updatedAt:t}];
return {version:1,docs,boards:[{id:'seed-board',name:'아이디어 맵',cards:[{id:'bc-a',targetId:'seed-idea',x:310,y:250},{id:'bc-b',targetId:'seed-research',x:650,y:375},{id:'bc-c',targetId:'seed-note',x:995,y:220}],edges:[{id:'be-1',from:'bc-a',to:'bc-b'},{id:'be-2',from:'bc-b',to:'bc-c'}],updatedAt:t}],links:[{id:'ln-1',from:'seed-idea',to:'seed-research',context:'관련 참고'}],categories:['에세이','작업 노트'],updatedAt:t};};
let state;
function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window)){resolve(null);return;}const req=indexedDB.open(STORE,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('app'))db.createObjectStore('app');};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
function dbGet(){return new Promise((resolve,reject)=>{if(!db){resolve(null);return;}const tx=db.transaction('app','readonly');const r=tx.objectStore('app').get('state');r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error);});}
function dbPut(value){return new Promise((resolve,reject)=>{if(!db){try{localStorage.setItem(STORE,JSON.stringify(value));resolve();}catch(e){reject(e);}return;}const tx=db.transaction('app','readwrite');tx.objectStore('app').put(value,'state');tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);});}
function persist(silent=false){clearTimeout(saveTimer);saveStatus='saving';if(currentView==='editor')updateSaveIndicator();saveTimer=setTimeout(async()=>{try{state.updatedAt=now();await dbPut(state);saveStatus='saved';if(currentView==='editor')updateSaveIndicator();if(!silent) toast('변경 사항을 저장했어요.');}catch(e){saveStatus='error';if(currentView==='editor')updateSaveIndicator();toast('저장하지 못했어요. 저장 공간을 확인해 주세요.',true);}},230);}
function updateSaveIndicator(){const el=$('#saveState');if(!el)return;const labels={saving:'저장 중…',saved:'모든 변경 사항 저장됨',error:'저장 실패 · 다시 시도 필요'};el.innerHTML=`<i class="save-dot" style="background:${saveStatus==='error'?'#c43a31':saveStatus==='saved'?'#777':'#c9a346'}"></i>${labels[saveStatus]||labels.saved}`;}

function updateSelectedBoardUi(){const button=$('[data-action="delete-selected-card"]');if(button)button.disabled=selectedCardIds.length===0;}function saveBoardHistory(){const b=getBoard(currentBoardId);if(!b)return;boardUndoStack.push(JSON.stringify({cards:b.cards||[],edges:b.edges||[],drawingData:b.drawingData||''}));if(boardUndoStack.length>60)boardUndoStack.shift();boardRedoStack=[];}
function restoreBoardHistory(from,to){const b=getBoard(currentBoardId);if(!b||!from.length)return;to.push(JSON.stringify({cards:b.cards||[],edges:b.edges||[],drawingData:b.drawingData||''}));const prior=JSON.parse(from.pop());b.cards=prior.cards;b.edges=prior.edges;b.drawingData=prior.drawingData||'';b.updatedAt=now();persist(true);render();}

function renderLibrary(kind='all',title='Documents',desc='기록을 찾고, 다시 읽고, 새로운 연결을 만들어보세요.'){const source=currentView==='inbox'?notes():currentView==='documents'?documents():currentView==='recent'?[...state.docs].sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt)):state.docs;let list=source.filter(d=>{if(searchQuery&&!`${d.title} ${d.body} ${tagsFor(d).join(' ')} ${d.category||''} ${(d.attachments||[]).map(a=>a.name+' '+a.url).join(' ')}`.toLowerCase().includes(searchQuery.toLowerCase()))return false;if(searchFilter==='note'&&d.kind!=='note')return false;if(searchFilter==='document'&&d.kind!=='document')return false;if(currentTag){if(currentTag.startsWith('category:')){if((d.category||'')!==currentTag.slice(9))return false;}else if(!tagsFor(d).includes(currentTag))return false;}return true;});const label=currentView==='inbox'?'QUICK CAPTURE':currentView==='recent'?'ACTIVITY':'YOUR LIBRARY';return `${heading(label,title,desc,`<button class="btn" data-action="create-document">${ico('plus')} 새 문서</button><button class="btn primary" data-action="quick-note">${ico('plus')} 빠른 메모</button>`)}<div class="filterbar"><input class="filter-input" id="librarySearch" placeholder="기록 안에서 검색…" value="${escapeHtml(searchQuery)}"><select class="filter-select" id="typeFilter"><option value="all" ${searchFilter==='all'?'selected':''}>모든 유형</option><option value="note" ${searchFilter==='note'?'selected':''}>퀵 메모</option><option value="document" ${searchFilter==='document'?'selected':''}>문서</option></select><select class="filter-select" id="categoryFilter"><option value="all">모든 카테고리</option>${state.categories.map(c=>`<option ${currentTag===`category:${c}`?'selected':''} value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}</select>${currentTag&&!currentTag.startsWith('category:')?`<button class="btn small" id="clearTag"># ${escapeHtml(currentTag)} ×</button>`:''}<span style="font-size:10px;color:#aaa;margin-left:auto">${list.length} items</span></div><div class="library-list function renderEditor(){const d=getDoc(activeDocId);if(!d){currentView='documents';return renderLibrary('all','Documents');}const title=d.title||'';const outgoing=state.links.filter(l=>l.from===d.id);const incoming=state.links.filter(l=>l.to===d.id);const refs=outgoing.map(l=>({link:l,doc:getDoc(l.to)})).filter(x=>x.doc);const backs=incoming.map(l=>({link:l,doc:getDoc(l.from)})).filter(x=>x.doc);const atts=d.attachments||[];return `${heading(d.kind==='note'?'QUICK CAPTURE':'DOCUMENT EDITOR',d.kind==='note'?'메모를 다듬어보세요':'문서를 발전시켜보세요',`최종 수정 ${fmtDate(d.updatedAt,true)}`,`<button class="btn" data-action="back-library">닫기</button><button class="btn primary" data-action="promote-note" ${d.kind==='document'?'disabled':''}>문서로 전환 ${ico('arrow')}</button>`)}<div class="editor-layout"><div class="editor-main"><div class="editor-toolbar"><div class="save-state" id="saveState"><i class="save-dot"></i>모든 변경 사항 저장됨</div><div style="display:flex;gap:6px"><button class="btn small" data-action="add-url">${ico('link')} 링크</button><button class="btn small" data-action="attach-file">${ico('paperclip')} 파일</button></div></div><textarea class="editor-title" id="editorTitle" placeholder="제목 없는 기록" rows="1" maxlength="240">${escapeHtml(title)}</textarea><div class="editor-meta"><span>${d.kind==='note'?'Quick note':'Document'}</span><span class="dotsep">•</span><span>생성 ${fmtDate(d.createdAt)}</span><span class="dotsep">•</span><span>${(d.body||'').length} characters</span></div><div class="formatbar"><button data-format="h2"><b>H2</b></button><button data-format="bold"><b>B</b></button><button data-format="italic"><i>I</i></button><button data-format="list">☷ 목록</button><button data-format="quote">❝ 인용</button><span style="width:1px;background:#eee;margin:3px 4px"></span><button data-action="insert-link">↗ 링크 삽입</button></div><textarea class="editor-body" id="editorBody" placeholder="생각을 펼쳐보세요. 완성되지 않은 문장이어도 괜찮아요…">${escapeHtml(d.body||'')}</textarea><div style="border-top:1px solid #eee;padding-top:12px;display:flex;justify-content:space-between;align-items:center"><span class="hint">변경 사항은 자동으로 저장됩니다.</span><button class="btn small danger" data-action="delete-doc">${ico('trash')} 기록 삭제</button></div></div><aside class="editor-sidebar"><section class="side-section"><div class="side-section-head"><span>정리하기</span>${ico('tag')}</div><div class="side-section-body"><label class="field-label" for="editorCategory">카테고리</label><select class="field" id="editorCategory"><option value="">미분류</option>${state.categories.map(c=>`<option ${d.category===c?'selected':''} value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}</select><label class="field-label" for="editorTags" style="margin-top:14px">태그</label><input class="field" id="editorTags" value="${escapeHtml(tagsFor(d).join(', '))}" placeholder="아이디어, 리서치"><div class="form-help">쉼표로 구분해 입력하세요. 태그는 여러 기록에서 재사용할 수 있습니다.</div></div></section><section class="side-section"><div class="side-section-head"><span>문서 연결</span><button class="text-link" data-action="link-document">+ 추가</button></div><div class="side-section-body"><div class="field-label">참조하는 문서 · ${refs.length}</div>${refs.length?refs.map(x=>`<div class="relation-item" data-open-doc="${x.doc.id}">${ico('file')}<span class="relation-text">${escapeHtml(x.doc.title||'제목 없는 문서')}</span><button data-remove-link="${x.link.id}" title="연결 해제">×</button></div>`).join(''):'<div class="hint">연결된 문서가 없습니다.</div>'}<div class="field-label" style="margin-top:13px">이 문서를 참조함 · ${backs.length}</div>${backs.length?backs.map(x=>`<div class="relation-item" data-open-doc="${x.doc.id}">${ico('network')}<span class="relation-text">${escapeHtml(x.doc.title||'제목 없는 문서')}</span></div>`).join(''):'<div class="hint">아직 백링크가 없습니다.</div>'}</div></section><section class="side-section"><div class="side-section-head"><span>첨부 자료</span><button class="text-link" data-action="attach-file">+ 추가</button></div><div class="side-section-body">${atts.length?atts.map(a=>`<div class="a function renderBoard(){const b=getBoard(currentBoardId);if(!b){currentView='boards';return renderBoards();}const chain=[];let q=b;while(q){chain.unshift(q);q=q.parentId?getBoard(q.parentId):null;}const cards=b.cards||[],edges=b.edges||[];const html=cards.map(c=>{if(c.type==='board'){const child=getBoard(c.boardId);return child?'<div class="board-item nested" data-card="'+c.id+'" data-open-board="'+child.id+'" style="left:'+c.x+'px;top:'+c.y+'px"><div class="item-head">▣ 하위 보드</div><div class="item-content"><b>'+escapeHtml(child.name)+'</b><br>'+child.cards.length+'개 항목 · 열기 ↗</div></div>':'';}if(c.type==='doc'||c.targetId){const d=getDoc(c.targetId);return d?'<div class="board-card" data-card="'+c.id+'" data-open-doc="'+d.id+'" style="left:'+c.x+'px;top:'+c.y+'px"><div class="board-card-title">'+escapeHtml(d.title||'제목 없는 기록')+'</div><div class="board-card-body">'+escapeHtml(plain(d.body).slice(0,100))+'</div></div>':'';}const types={note:'메모',link:'링크',todo:'할 일',column:'컬럼',sketch:'스케치',file:'문서 첨부',audio:'오디오',table:'표',comment:'코멘트',video:'비디오',image:'이미지'};let text=escapeHtml(c.content||c.url||'');if(c.type==='sketch'&&c.content?.startsWith('data:image'))text='<img src="'+escapeHtml(c.content)+'" alt="스케치" style="display:block;max-width:100%;max-height:220px">';if(c.type==='todo')text=(c.checked?'☑':'☐')+' '+text;if(c.type==='table')text='<table><tbody>'+((c.content||'').split('\n').map(r=>'<tr>'+r.split(',').map(v=>'<td>'+escapeHtml(v)+'</td>').join('')+'</tr>').join(''))+'</tbody></table>';if(c.type==='image'&&(c.imageData||c.url))text='<img src="'+escapeHtml(c.imageData||c.url)+'" alt="보드 이미지" style="display:block;max-width:100%;max-height:210px;object-fit:contain">';if(['link','file','audio','video','image'].includes(c.type)&&c.url&&c.type!=='image')text='<a href="'+escapeHtml(c.url)+'" target="_blank" rel="noopener">'+escapeHtml(c.url)+'</a>';return '<div class="board-item '+(c.type==='column'?'column':'')+'" data-card="'+c.id+'" data-edit-board-item="'+c.id+'" style="left:'+c.x+'px;top:'+c.y+'px"><div class="item-head">'+(types[c.type]||c.type)+'<button class="board-card-menu" data-remove-board-item="'+c.id+'" title="요소 삭제">×</button></div><div class="item-content">'+text+'</div></div>';}).join('');return heading('VISUAL WORKSPACE',escapeHtml(b.name),cards.length+'개의 항목 · '+edges.length+'개의 연결','<button class="btn" data-action="rename-board">이름 변경</button>')+'<div class="board-breadcrumb">'+chain.map(x=>'<button data-open-board="'+x.id+'">'+escapeHtml(x.name)+'</button>').join(' / ')+'</div><div class="board-tools">'+[['note','메모'],['link','링크'],['todo','할 일'],['line','선'],['column','컬럼'],['sketch','스케치'],['file','문서'],['audio','오디오'],['table','표'],['comment','코멘트'],['video','비디오'],['image','이미지']].map(x=>'<button class="btn small" draggable="true" data-board-item="'+x[0]+'">'+x[1]+'</button>').join('')+'<button class="btn small" data-action="add-board-card">기존 문서</button></div><div class="board-toolbar"><button class="btn small" data-action="board-fit">화면 맞춤</button><button class="btn small" data-action="delete-selected-card" '+(selectedCard?'':'disabled')+'>선택 항목 제거</button></div><div class="board-wrap" id="boardWrap"><div class="board-viewport"><div class="board-world" id="boardWorld" style="transform:translate('+boardTransform.x+'px,'+boardTransform.y+'px) scale('+boardTransform.scale+')"><svg class="board-edges" id="boardEdges" viewBox="0 0 2200 1600">'+edges.map(e=>{const x=cards.find(c=>c.id===e.from),y=cards.find(c=>c.id===e.to);return x&&y?'<line class="board-edge-line" x1="'+(x.x+100)+'" y1="'+(x.y+60)+'" x2="'+(y.x+100)+'" y2="'+(y.y+60)+'"/>':'';}).join('')+'</svg>'+html+'</div></div><div class="board-floating"><div class="board-tip">빈 곳을 꾹 눌러 영역을 선택하고, 휠 버튼을 누른 채 드래그해 보드를 이동하세요.</div><div class="zoom-controls"><button data-action="zoom-out">−</button><span class="zoom-label">'+Math.round(boardTransform.scale*100)+'%</span><button data-action="zoom-in">+</button></div></div></div>'; }
function renderTags(){const counts=tagCounts();const tags=Object.keys(counts).sort((a,b)=>a.localeCompare(b,'ko'));const cats=state.categories;const filtered=currentTag?state.docs.filter(d=>tagsFor(d).includes(currentTag)||d.category===currentTag):[];return `${heading('ORGANIZE LIGHTLY','태그와 카테고리','분류는 시작부터 완벽할 필요가 없어요. 필요할 때 가볍게 정리하세요.',`<button class="btn" data-action="create-category">${ico('plus')} 카테고리 추가</button>`)}<div class="tags-layout"><div class="tag-summary"><div class="eyebrow">YOUR VOCABULARY</div><strong>${tags.length+cats.length}</strong><p>개의 태그와 카테고리로 기록을 정리하고 있어요. 태그는 유연하게, 카테고리는 조금 더 안정적으로 사용해 보세요.</p><button class="btn" style="margin-top:15px;width:100%" data-action="create-tag">새 태그 안내</button></div><div><div class="section-head"><h2>태그 <span style="color:#aaa;font-weight:400">${tags.length}</span></h2><span class="hint">선택하면 관련 기록을 볼 수 있어요</span></div><div class="tag-cloud" style="margin-bottom:28px">${tags.map(t=>`<button class="tag-chip ${currentTag===t?'active':''}" data-tag="${escapeHtml(t)}"># ${escapeHtml(t)} <span>${counts[t]}</span></button>`).join('')||'<div class="panel empty" style="width:100%;padding:30px"><p>아직 태그가 없습니다. 문서를 열고 태그를 추가해보세요.</p></div>'}</div><div class="section-head"><h2>카테고리 <span style="color:#aaa;font-weight:400">${cats.length}</span></h2></div><div class="tag-cloud">${cats.map(c=>`<button class="tag-chip ${currentTag===`category:${c}`?'active':''}" data-category-tag="${escapeHtml(c)}">${ico('layout')} ${escapeHtml(c)} <span>${state.docs.filter(d=>d.category===c).length}</span></button>`).join('')||'<span class="hint">카테고리가 아직 없어요.</span>'}</div>${currentTag?`<div style="margin-top:27px"><div class="section-head"><h2>‘${escapeHtml(currentTag.replace('category:',''))}’ 기록</h2><button class="text-link" data-action="clear-tag">초기화 ×</button></div><div class="panel"><div class="recent-list">${filtered.length?filtered.map(docRow).join(''):'<div class="empty"><p>이 분류에 해당하는 기록이 없어요.</p></div>'}</div></div></div>`:''}</div></div>`;}
function renderConnections(){const stats=new Map(state.docs.map(d=>[d.id,0]));state.links.forEach(l=>{stats.set(l.from,(stats.get(l.from)||0)+1);stats.set(l.to,(stats.get(l.to)||0)+1)});const connected=state.docs.filter(d=>(stats.get(d.id)||0)>0).sort((a,b)=>(stats.get(b.id)||0)-(stats.get(a.id)||0));return `${heading('KNOWLEDGE GRAPH','연결 관계','문서가 서로를 참조하는 방식을 살펴보세요. 백링크는 연결 데이터에서 자동으로 계산됩니다.',`<button class="btn" data-view="documents">문서 찾아보기</button>`)}<div class="panel" style="margin-bottom:17px"><div class="panel-head"><div><h3>문서 연결</h3><p>${state.links.length}개의 내부 참조 관계</p></div><span class="status-pill"><i></i>Auto backlinks</span></div>${connected.length?`<div class="recent-list">${connected.map(d=>{const out=state.links.filter(l=>l.from===d.id).length,ins=state.links.filter(l=>l.to===d.id).length;return `<div class="doc-row" data-open-doc="${d.id}">${fileIcon(d.kind)}<div class="row-copy"><div class="row-title">${escapeHtml(d.title||plain(d.body).slice(0,42)||'제목 없는 기록')}</div><div class="row-snippet">${escapeHtml(plain(d.body).slice(0,80))}</div></div><div class="row-meta">↗ ${out} · ↙ ${ins}</div></div>`}).join('')}</div>`:`<div class="empty"><div class="empty-mark">${ico('network')}</div><h3>아직 연결이 없어요</h3><p>문서를 열고 오른쪽의 ‘문서 연결’에서 다른 문서를 참조해보세요.</p></div>`}</div><div class="settings-card"><h3>연결 규칙</h3><p>문서 A에서 문서 B를 연결하면 A의 참조 목록에는 B가, B의 백링크에는 A가 표시됩니다. 보드에서 그리는 시각적 선은 별도 관계로 관리됩니다.</p></div>`;}
function renderSettings(){return `${heading('PREFERENCES','설정 및 데이터','이 버전은 현재 브라우저에 데이터를 저장합니다.',`<button class="btn" data-action="export-data">${ico('external')} 데이터 내보내기</button>`)}<div class="settings-grid"><div class="settings-card"><div class="eyebrow">STORAGE</div><h3 style="margin-top:10px">브라우저 로컬 저장</h3><p>문서, 메모, 보드와 첨부 파일은 이 브라우저의 IndexedDB 저장 공간에 보관됩니다. 브라우저 데이터 삭제나 다른 기기에서는 자동으로 복원되지 않습니다.</p><span class="status-pill"><i></i>${db?'IndexedDB 연결됨':'Local storage fallback'}</span></div><div class="settings-card"><div class="eyebrow">BACKUP</div><h3 style="margin-top:10px">백업 파일 만들기</h3><p>현재 데이터를 JSON 파일로 내려받아 보관할 수 있습니다. 첨부 파일은 내보내기 시 파일 데이터도 포함합니다. 민감한 자료는 안전한 위치에 보관하세요.</p><button class="btn primary" data-action="export-data">데이터 내보내기</button></div><div class="settings-card"><div class="eyebrow">RESTORE</div><h3 style="margin-top:10px">백업에서 복원</h3><p>이전에 Folio에서 내보낸 JSON 파일을 불러옵니다. 현재 데이터는 가져온 데이터로 교체되므로 먼저 백업하는 것을 권장합니다.</p><button class="btn" data-action="import-data">백업 파일 선택</button></div><div class="settings-card"><div class="eyebrow">SYNC & SECURITY</div><h3 style="margin-top:10px">계정 및 동기화</h3><p>이 초기 버전에는 로그인, 서버 저장, 기기 간 동기화 기능이 없습니다. 실제 배포 서비스에서 사용하려면 인증, 서버 데이터베이스, 접근 권한 정책을 추가해야 합니다.</p><span class="status-pill"><i style="background:#b88442"></i>Cloud sync not configured</span></div><div class="settings-card" style="grid-column:1/-1"><div class="eyebrow">DANGER ZONE</div><h3 style="margin-top:10px">로컬 데이터 초기화</h3><p>현재 브라우저에 저장된 문서, 메모, 보드, 연결 정보를 모두 삭제하고 샘플 데이터로 되돌립니다. 이 작업은 되돌릴 수 없습니다.</p><button class="btn danger" data-action="reset-data">초기화 및 샘플 데이터 복원</button></div></div><input id="importPicker" type="file" accept="application/json,.json" hidden>`;}
function render(){updateCounts();$$('.nav-btn[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===currentView||(currentView==='editor'&&b.dataset.view===(getDoc(activeDocId)?.kind==='note'?'inbox':'documents'))||(['board','boards'].includes(currentView)&&b.dataset.view==='boards')));const root=$('#viewRoot');$('#crumbText').textContent=({home:'Overview',inbox:'Quick notes',documents:'Documents',editor:'Editor',boards:'Boards',board:'Board',tags:'Tags & categories',recent:'Recently updated',links:'Connections',settings:'Settings'})[currentView]||'Overview';if(currentView==='home')root.innerHTML=renderHome();else if(['inbox','documents','recent'].includes(currentView))root.innerHTML=renderLibrary('all',currentView==='inbox'?'Quick notes':currentView==='recent'?'Recently updated':'Documents',currentView==='inbox'?'가볍게 남겨둔 생각을 확인하고, 필요한 기록으로 발전시켜보세요.':currentView==='recent'?'최근 수정한 모든 메모와 문서입니다.':'모든 문서를 한곳에서 검색하고 관리하세요.');else if(currentView==='editor')root.innerHTML=renderEditor();else if(currentView==='boards')root.innerHTML=renderBoards();else if(currentView==='board')root.innerHTML=renderBoard();else if(currentView==='tags')root.innerHTML=renderTags();else if(currentView==='links')root.innerHTML=renderConnections();else if(currentView==='settings')root.innerHTML=renderSettings();if(['board','boards'].includes(currentView)){const toolbar=$('.board-toolbar',root);if(toolbar)toolbar.insertAdjacentHTML('afterbegin','<button class="btn small" data-action="board-undo" title="실행 취소">↶ 되돌리기</button><button class="btn small" data-action="board-redo" title="다시 실행">↷ 다시 실행</button>');}if(currentView==='boards'&&state.boards.length){root.querySelector('[data-action="create-nested-board"]')?.remove();const actions=$('.page-heading .heading-actions',root);if(actions){const select=document.createElement('select');select.className='filter-select';select.setAttribute('aria-label','보드 선택');select.innerHTML=state.boards.map(b=>`<option value="${b.id}" ${b.id===currentBoardId?'selected':''}>${escapeHtml(b.name)}</option>`).join('');select.addEventListener('change',()=>openBoard(select.value));actions.prepend(select);}}root.querySelectorAll('[data-card]').forEach(el=>el.classList.toggle('selected',selectedCardIds.includes(el.dataset.card)));root.querySelectorAll('[data-board-item]').forEach(el=>el.draggable=true);root.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=ico(el.dataset.icon));if(currentView==='editor')wireEditor();if(['board','boards'].includes(currentView))wireBoardSketch(root);}
function createDoc(kind='document',title='',body=''){const t=now();const d={id:uid(),kind,title,body,tags:[],category:'',attachments:[],createdAt:t,updatedAt:t};state.docs.unshift(d);activeDocId=d.id;saveStatus='saved';persist(true);currentView='editor';render();setTimeout(()=>$('#editorTitle')?.focus(),0);return d;}

function wireBoardSketch(root){const b=getBoard(currentBoardId),world=$('#boardWorld',root);if(!b||!world)return;let canvas=$('#boardSketchCanvas',world);if(!canvas){canvas=document.createElement('canvas');canvas.id='boardSketchCanvas';canvas.width=2200;canvas.height=1600;canvas.style.cssText='position:absolute;inset:0;z-index:1;pointer-events:none;touch-action:none';world.prepend(canvas);}canvas.style.pointerEvents=boardSketchMode?'auto':'none';canvas.style.cursor=boardSketchMode?'crosshair':'default';const ctx=canvas.getContext('2d');if(b.drawingData&&!canvas.dataset.loaded){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0);img.src=b.drawingData;canvas.dataset.loaded='1';}let bar=$('.board-sketch-tools',root);if(boardSketchMode&&!bar){bar=document.createElement('div');bar.className='board-sketch-tools';bar.innerHTML='<select id="boardSketchTool" class="filter-select"><option value="pen">펜</option><option value="line">선</option><option value="rect">사각형</option><option value="circle">원</option><option value="eraser">지우개</option></select><input id="boardSketchWidth" type="range" min="1" max="40" value="4"><input id="boardSketchColor" type="color" value="#222222"><button class="btn small" data-action="board-sketch-done">그리기 완료</button>';$('.board-tools',root)?.after(bar);}if(!boardSketchMode){bar?.remove();return;}$('#boardSketchTool',root).value=boardSketchTool;$('#boardSketchWidth',root).value=boardSketchWidth;$('#boardSketchColor',root).value=boardSketchColor;let drawing=false,start=null,snapshot=null;const pt=e=>{const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height};};canvas.onpointerdown=e=>{drawing=true;start=pt(e);snapshot=ctx.getImageData(0,0,canvas.width,canvas.height);saveBoardHistory();canvas.setPointerCapture(e.pointerId);};canvas.onpointermove=e=>{if(!drawing)return;const p=pt(e);ctx.putImageData(snapshot,0,0);ctx.lineWidth=boardSketchWidth;ctx.strokeStyle=boardSketchColor;ctx.lineCap='round';ctx.globalCompositeOperation=boardSketchTool==='eraser'?'destination-out':'source-over';ctx.beginPath();if(boardSketchTool==='line'){ctx.moveTo(start.x,start.y);ctx.lineTo(p.x,p.y);ctx.stroke();}else if(boardSketchTool==='rect'){ctx.strokeRect(start.x,start.y,p.x-start.x,p.y-start.y);}else if(boardSketchTool==='circle'){ctx.ellipse((start.x+p.x)/2,(start.y+p.y)/2,Math.abs(p.x-start.x)/2,Math.abs(p.y-start.y)/2,0,0,Math.PI*2);ctx.stroke();}else{ctx.moveTo(start.x,start.y);ctx.lineTo(p.x,p.y);ctx.stroke();start=p;}};canvas.onpointerup=()=>{if(!drawing)return;drawing=false;ctx.globalCompositeOperation='source-over';b.drawingData=canvas.toDataURL('image/png');b.updatedAt=now();persist(true);};$('#boardSketchTool',root).onchange=e=>boardSketchTool=e.target.value;$('#boardSketchWidth',root).oninput=e=>boardSketchWidth=+e.target.value;$('#boardSketchColor',root).oninput=e=>boardSketchColor=e.target.value;}
document.addEventListener('click',e=>{const t=e.target.closest('[data-action]');if(t){const a=t.dataset.action;if(a==='modal-confirm'){if(modalConfirm?.()!==false)modalConfirm=null;return;}if(a==='create-document'){createDoc();return;}if(a==='quick-note'){showQuickModal();return;}if(a==='create-board'){showCreateBoardModal();return;}if(a==='add-board-card'){showAddBoardCardModal();return;}if(a==='rename-board'){const b=getBoard(currentBoardId);if(!b)return;const name=prompt('보드 이름',b.name);if(name?.trim()){b.name=name.trim();persist(true);render();}return;}if(a==='board-undo'){undoBoard();return;}if(a==='board-redo'){redoBoard();return;}if(a==='board-sketch-done'){boardSketchMode=false;render();return;}if(a==='delete-selected-card'){removeSelectedCard();return;}if(a==='zoom-in'||a==='zoom-out'){zoomBoard(boardTransform.scale*(a==='zoom-in'?1.15:1/1.15));return;}if(a==='board-fit'){boardTransform={x:0,y:0,scale:1};render();return;}if(a==='back-library'){currentView='documents';render();return;}if(a==='promote-note'){const d=getDoc(activeDocId);if(d){d.kind='document';persist(true);render();}return;}if(a==='delete-doc'){const d=getDoc(activeDocId);if(d&&confirm('이 기록을 삭제할까요?')){state.docs=state.docs.filter(x=>x.id!==d.id);state.links=state.links.filter(x=>x.from!==d.id&&x.to!==d.id);currentView='documents';persist(true);render();}return;}if(a==='add-url'){showUrlModal();return;}if(a==='attach-file'){attachFiles();return;}if(a==='insert-link'){insertFormat('link');return;}if(a==='export-data'){exportData();return;}if(a==='import-data'){importData();return;}if(a==='reset-data'){resetData();return;}if(a==='create-category'){showCreateCategory();return;}if(a==='modal-close'){closeModal();return;}return;}
const save=e.target.closest('[data-inline-save]');if(save){saveInlineBoardItem();return;}if(e.target.closest('[data-inline-cancel]')){inlineBoardEditId=null;render();return;}const del=e.target.closest('[data-remove-board-item]');if(del){e.stopPropagation();selectedCard=del.dataset.removeBoardItem;selectedCardIds=[selectedCard];removeSelectedCard();return;}const palette=e.target.closest('[data-board-item]');if(palette){if(palette.dataset.boardItem==='image')showImageInsertModal();else addBoardItem(palette.dataset.boardItem,boardDropPosition);boardDropPosition=null;return;}const openBoardBtn=e.target.closest('[data-open-board]');if(openBoardBtn){openBoard(openBoardBtn.dataset.openBoard);return;}const doc=e.target.closest('[data-open-doc]');if(doc){openDoc(doc.dataset.openDoc);return;}const item=e.target.closest('[data-edit-board-item]');if(item){if(suppressBoardCardClick){suppressBoardCardClick=false;return;}startInlineBoardEdit(item.dataset.editBoardItem);return;}const nav=e.target.closest('[data-view]');if(nav){currentView=nav.dataset.view;if(currentView==='boards'&&!currentBoardId&&state.boards[0])currentBoardId=state.boards[0].id;render();return;}const tag=e.target.closest('[data-tag]');if(tag){currentTag=tag.dataset.tag;currentView='documents';render();return;}if(e.target.closest('[data-modal-close]'))closeModal();});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.target.closest('input,textarea,select')){spacePressed=true;e.preventDefault();}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&['board','boards'].includes(currentView)){e.preventDefault();e.shiftKey?redoBoard():undoBoard();}if(e.key==='Escape'&&$('#modalRoot').innerHTML)closeModal();});window.addEventListener('keyup',e=>{if(e.code==='Space')spacePressed=false;});
document.addEventListener('input',e=>{if(e.target.id==='librarySearch'){searchQuery=e.target.value;render();const x=$('#librarySearch');x?.focus();x?.setSelectionRange(searchQuery.length,searchQuery.length);}if(e.target.id==='editorTitle'||e.target.id==='editorBody')updateDocFromEditor();});document.addEventListener('change',e=>{if(e.target.id==='typeFilter'){searchFilter=e.target.value;render();}if(e.target.id==='editorCategory'||e.target.id==='editorTags')updateDocFromEditor();if(e.target.id==='importPicker'&&e.target.files?.[0])readImport(e.target.files[0]);if(e.target.id==='filePicker'&&e.target.files?.length)handleFiles(e.target.files);});
document.addEventListener('dragstart',e=>{const p=e.target.closest('[data-board-item]');if(p)e.dataTransfer.setData('text/board-item',p.dataset.boardItem);});document.addEventListener('dragover',e=>{if(e.target.closest('#boardWrap'))e.preventDefault();});document.addEventListener('drop',async e=>{const wrap=e.target.closest('#boardWrap');if(!wrap)return;e.preventDefault();const rect=wrap.getBoundingClientRect();boardDropPosition={x:(e.clientX-rect.left-boardTransform.x)/boardTransform.scale,y:(e.clientY-rect.top-boardTransform.y)/boardTransform.scale};const file=[...(e.dataTransfer.files||[])].find(f=>f.type.startsWith('image/'));if(file){addBoardImage(await fileToDataUrl(file),'',boardDropPosition);return;}const type=e.dataTransfer.getData('text/board-item');if(type)addBoardItem(type,boardDropPosition);});
$('#viewRoot').addEventListener('pointerdown',e=>{if(!['board','boards'].includes(currentView))return;const world=$('#boardWorld'),wrap=$('#boardWrap');if(!world||!wrap||!wrap.contains(e.target)||e.target.closest('.board-floating,.board-tools,.board-sketch-tools'))return;const pt={x:e.clientX,y:e.clientY};if(e.button===1||spacePressed){boardDrag={kind:'pan',startX:pt.x,startY:pt.y,origX:boardTransform.x,origY:boardTransform.y,moved:false};e.preventDefault();return;}if(e.button!==0||e.target.closest('input,textarea,select,button'))return;const card=e.target.closest('[data-card]');if(card){const id=card.dataset.card,b=getBoard(currentBoardId);if(!b?.cards.some(x=>x.id===id))return;if(!selectedCardIds.includes(id)){selectedCard=id;selectedCardIds=[id];$$('[data-card]',world).forEach(el=>el.classList.toggle('selected',el.dataset.card===id));updateSelectedBoardUi();}const origins=(selectedCardIds.includes(id)?selectedCardIds:[id]).map(key=>{const c=b.cards.find(x=>x.id===key);return c&&{id:key,x:c.x,y:c.y};}).filter(Boolean);boardDrag={kind:'card',startX:pt.x,startY:pt.y,origins,moved:false};e.preventDefault();return;}const r=wrap.getBoundingClientRect();boardDrag={kind:'select-pending',startX:pt.x,startY:pt.y,localX:pt.x-r.left,localY:pt.y-r.top,wrapRect:r,moved:false};boardDrag.holdTimer=setTimeout(()=>{if(boardDrag?.kind!=='select-pending')return;const box=document.createElement('div');box.id='boardSelectionBox';box.style.cssText='position:absolute;border:1px solid #555;background:#1111;pointer-events:none;z-index:20';wrap.append(box);boardDrag.kind='marquee';},420);e.preventDefault();});
window.addEventListener('pointermove',e=>{if(!boardDrag||!['board','boards'].includes(currentView))return;const dx=e.clientX-boardDrag.startX,dy=e.clientY-boardDrag.startY;if(boardDrag.kind==='select-pending'){if(Math.hypot(dx,dy)>4){clearTimeout(boardDrag.holdTimer);boardDrag.kind='ignore';}return;}if(boardDrag.kind==='ignore')return;if(Math.hypot(dx,dy)>3&&!boardDrag.moved){boardDrag.moved=true;if(boardDrag.kind==='card')saveBoardHistory();}const world=$('#boardWorld');if(!world)return;if(boardDrag.kind==='pan'){boardTransform.x=boardDrag.origX+dx;boardTransform.y=boardDrag.origY+dy;world.style.transform=`translate(${boardTransform.x}px,${boardTransform.y}px) scale(${boardTransform.scale})`;}else if(boardDrag.kind==='marquee'){const box=$('#boardSelectionBox');if(box){const x=e.clientX-boardDrag.wrapRect.left,y=e.clientY-boardDrag.wrapRect.top;box.style.left=Math.min(boardDrag.localX,x)+'px';box.style.top=Math.min(boardDrag.localY,y)+'px';box.style.width=Math.abs(x-boardDrag.localX)+'px';box.style.height=Math.abs(y-boardDrag.localY)+'px';}}else if(boardDrag.kind==='card'){const b=getBoard(currentBoardId);for(const origin of boardDrag.origins||[]){const c=b?.cards.find(x=>x.id===origin.id),node=$(`[data-card="${origin.id}"]`,world);if(!c||!node)continue;c.x=Math.max(0,origin.x+dx/boardTransform.scale);c.y=Math.max(0,origin.y+dy/boardTransform.scale);node.style.left=c.x+'px';node.style.top=c.y+'px';}drawEdges();}});
window.addEventListener('pointerup',e=>{if(!boardDrag)return;if(boardDrag.kind==='select-pending'){clearTimeout(boardDrag.holdTimer);boardDrag=null;return;}if(boardDrag.kind==='ignore'){boardDrag=null;return;}if(boardDrag.kind==='marquee'){const box=$('#boardSelectionBox'),x1=Math.min(boardDrag.startX,e.clientX),x2=Math.max(boardDrag.startX,e.clientX),y1=Math.min(boardDrag.startY,e.clientY),y2=Math.max(boardDrag.startY,e.clientY);selectedCardIds=[];if(boardDrag.moved){$$('[data-card]','#boardWorld').forEach(el=>{const r=el.getBoundingClientRect();if(r.right>=x1&&r.left<=x2&&r.bottom>=y1&&r.top<=y2)selectedCardIds.push(el.dataset.card);});}selectedCard=selectedCardIds[0]||null;if(box)box.remove();$$('[data-card]','#boardWorld').forEach(el=>el.classList.toggle('selected',selectedCardIds.includes(el.dataset.card)));updateSelectedBoardUi();if(selectedCardIds.length)toast(`${selectedCardIds.length}개 요소를 선택했어요.`);}else if(boardDrag.kind==='card'&&boardDrag.moved){suppressBoardCardClick=true;const b=getBoard(currentBoardId);if(b){b.updatedAt=now();persist(true);}}boardDrag=null;});
function drawEdges(){const b=getBoard(currentBoardId),svg=$('#boardEdges');if(!b||!svg)return;svg.innerHTML=b.edges.map(e=>{const a=b.cards.find(c=>c.id===e.from),z=b.cards.find(c=>c.id===e.to);return a&&z?`<line class="board-edge-line" x1="${a.x+109}" y1="${a.y+65}" x2="${z.x+109}" y2="${z.y+65}"/>`:''}).join('');}
$('#viewRoot').addEventListener('wheel',e=>{if(!['board','boards'].includes(currentView)||!e.target.closest('#boardWrap'))return;e.preventDefault();zoomBoard(boardTransform.scale*(e.deltaY<0?1.08:1/1.08),e.clientX,e.clientY);},{passive:false});
async function init(){try{db=await openDB();state=await dbGet();}catch(e){db=null;try{const raw=localStorage.getItem(STORE);state=raw?JSON.parse(raw):null;}catch(_){state=null;}}if(!state){state=seed();try{await dbPut(state);}catch(e){console.warn(e);}}if(!Array.isArray(state.docs))state.docs=[];if(!Array.isArray(state.boards))state.boards=[];if(!Array.isArray(state.links))state.links=[];if(!Array.isArray(state.categories))state.categories=[];state.boards.forEach(b=>{b.cards=b.cards||[];b.edges=b.edges||[];});render();}
init();
